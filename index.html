<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | Interactive card details form</title>
</head>
<body>
  <main>
    <h1 class="sr-only">Interactive card details form</h1>
    <div class="card-preview" aria-hidden="true">
      <div class="card-front">
        <p class="card-number">0000 0000 0000 0000</p>
        <div class="cardholder-name-and-expiry">
          <p class="cardholder-name">Jane Appleseed</p>
          <p class="card-expiry">00/00</p>
        </div>
      </div>

      <div class="card-back">
        <p class="card-cvc">000</p>
      </div>
    </div>

    <form class="form-card-info">
      <h2 class="sr-only">Card information form</h2>

      <label class="label-cardholder-name" for="input-cardholder-name">Cardholder Name</label>
      <input type="text" id="input-cardholder-name" name="cardholderName" autocomplete="cc-name" placeholder="e.g. Jane Appleseed">
      
      <label class="label-card-number" for="input-card-number">Card Number</label>
      <input type="text" inputmode="numeric" id="input-card-number" name="cardNumber" autocomplete="cc-number" placeholder="e.g. 1234 5678 9123 0000">
      
      <fieldset class="fieldset-card-expiry">
        <legend>Exp. Date (MM/YY)</legend>
        <label class="sr-only" for="input-card-expiry-mm">Month</label>
        <input type="text" inputmode="numeric" id="input-card-expiry-mm" name="cardExpiryMonth" autocomplete="cc-exp-month" placeholder="MM">

        <label class="sr-only" for="input-card-expiry-yy">Year</label>
        <input type="text" inputmode="numeric" id="input-card-expiry-yy" name="cardExpiryYear" autocomplete="cc-exp-year" placeholder="YY">
      </fieldset>
      
      <label class="label-card-cvc" for="input-card-cvc">CVC</label>
      <input type="text" inputmode="numeric" id="input-card-cvc" name="cardCvc" autocomplete="cc-csc" placeholder="e.g. 123">
      
      <button type="submit">Confirm</button>
    </form>
    <!-- Completed state start -->

    <section class="completed-state" hidden>
      <h2>Thank you!</h2>
      <p>We've added your card details</p>
      <button type="button">Continue</button>
    </section>
  </main>
</body>
</html>
